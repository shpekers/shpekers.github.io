<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shpekers Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --accent: #a855f7;
  --hover: #c084fc;
  --bg: #0b0b10;
  --glass: rgba(255,255,255,0.05);
  --card-bg: rgba(255,255,255,0.05);
}

body {
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', sans-serif;
  margin: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.container-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.logo {
  font-size: 3rem;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent), #6d28d9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 30px;
}

.search-box {
  position: relative;
  width: 600px;
  max-width: 90%;
  user-select: none;
}

.search-input-row {
  display: flex;
  align-items: center;
  background: var(--glass);
  backdrop-filter: blur(10px);
  border-radius: 50px;
  padding: 12px 20px;
  box-shadow: 0 0 15px rgba(168,85,247,0.5);
}

.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 1.1rem;
}

.search-box button, .bi-youtube {
  font-size: 1.4rem;
  margin-left: 10px;
  cursor: pointer;
  color: var(--accent);
  background: none;
  border: none;
  transition: color 0.2s;
}

.search-box button:hover, .bi-youtube:hover { color: var(--hover); }

#historyDropdown {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 5px;
  background: rgba(20,20,25,0.95);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 100;
  opacity: 0;
  transform: translateY(-10px);
  pointer-events: none;
  transition: all 0.25s ease;
}

#historyDropdown.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s, opacity 0.2s;
  opacity: 0;
  transform: translateX(-15px);
}

#historyDropdown.show .history-item {
  animation: slideIn 0.25s forwards;
}

@keyframes slideIn {
  to { opacity: 1; transform: translateX(0); }
}

.history-item:hover {
  background: rgba(168,85,247,0.2);
  border-radius: 8px;
}

.history-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #fff;
}

.clear-history-btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  background: var(--accent);
  border-radius: 50%;
  color: #fff;
  width: 22px;
  height: 22px;
  font-size: 0.8rem;
  border: none;
}

.clear-history-btn:hover { background: var(--hover); }

.settings-btn {
  position: absolute;
  top: 20px;
  right: 25px;
  color: rgba(255,255,255,0.6);
  font-size: 1.6rem;
  cursor: pointer;
}

.settings-btn:hover { color: var(--accent); }

#clock {
  position: absolute;
  top: 20px;
  left: 25px;
  color: #fff;
  font-family: 'Courier New', monospace;
  font-size: 2rem;
  font-weight: bold;
  user-select: none;
  display: none;
}

.footer {
  text-align: center;
  margin-top: auto;
  padding: 15px 0;
  color: rgba(255,255,255,0.5);
  font-size: 0.9rem;
}

#shortcutContainer {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin-top: 25px;
  user-select: none;
}

.shortcut-card {
  width: 72px;
  height: 72px;
  background: var(--card-bg);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: grab;
  transition: background 0.2s;
}

.shortcut-card:active { cursor: grabbing; }

.shortcut-card:hover { background: rgba(255,255,255,0.1); }

.shortcut-card img {
  width: 32px;
  height: 32px;
  margin-bottom: 4px;
  filter: brightness(1.5);
}

.shortcut-card .shortcut-name {
  font-size: 0.7rem;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  color: #fff;
}

.shortcut-card .menu-btn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  font-size: 14px;
  color: #fff;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  border: none;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
}

.shortcut-card:hover .menu-btn { opacity: 1; }

.shortcut-dropdown {
  position: absolute;
  top: 100%;
  right: 0;
  background: rgba(20,20,25,0.95);
  border-radius: 8px;
  display: none;
  flex-direction: column;
  min-width: 100px;
  overflow: hidden;
  z-index: 100;
}

.shortcut-dropdown button {
  background: transparent;
  border: none;
  color: #fff;
  text-align: left;
  padding: 6px 10px;
  font-size: 0.85rem;
  cursor: pointer;
}

.shortcut-dropdown button:hover { background: rgba(168,85,247,0.2); }

.modal-content {
  background: rgba(20,20,25,0.95);
  border-radius: 15px;
  color: #fff;
}
.form-select, .btn, .form-control { 
  background: rgba(30,30,40,0.8); 
  color:#fff; 
  border:1px solid rgba(255,255,255,0.1);
}
.form-label { color:#fff; font-size:0.9rem; margin-bottom:3px; }
</style>
</head>
<body>
<div id="clock"></div>
<i class="bi bi-gear settings-btn" id="settingsBtn" title="Настройки"></i>

<div class="container-center">
  <div class="logo">Shpekers</div>

  <div class="search-box">
    <div class="search-input-row">
      <input id="query" type="text" autocomplete="off">
      <button id="searchBtn"><i class="bi bi-search"></i></button>
      <i class="bi bi-youtube" id="youtubeBtn" title="Искать на YouTube"></i>
    </div>
    <div id="historyDropdown"></div>
  </div>

  <div id="shortcutContainer"></div>
</div>

<div class="footer">© 2025 Shpekers Network</div>

<!-- Модальные окна (настройки и редактирование ярлыка) -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-end">
    <div class="modal-content p-4">
      <h5 class="mb-3">Настройки поиска</h5>
      <label class="form-label" for="searchEngine">Выберите поисковую систему:</label>
      <select id="searchEngine" class="form-select bg-dark text-light mb-2">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="yandex">Yandex</option>
        <option value="brave">Brave</option>
      </select>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="showClock">
        <label class="form-check-label text-white" for="showClock">Показывать часы</label>
      </div>
      <button id="saveSettings" class="btn btn-outline-light w-100 mt-2">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal fade" id="editShortcutModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5>Редактировать ярлык</h5>
      <label class="form-label" for="editShortcutName">Название</label>
      <input type="text" id="editShortcutName" class="form-control mb-2">
      <label class="form-label" for="editShortcutURL">URL</label>
      <input type="text" id="editShortcutURL" class="form-control mb-2">
      <button class="btn btn-outline-light w-100" id="saveEditShortcut">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
// JS полностью рабочий, включая анимацию истории
// ---------------------- JS ----------------------
const query=document.getElementById('query');
const searchBtn=document.getElementById('searchBtn');
const youtubeBtn=document.getElementById('youtubeBtn');
const settingsBtn=document.getElementById('settingsBtn');
const searchEngineSelect=document.getElementById('searchEngine');
const saveSettings=document.getElementById('saveSettings');
const historyDropdown=document.getElementById('historyDropdown');
const shortcutContainer=document.getElementById('shortcutContainer');
const clockEl=document.getElementById('clock');
const showClockCheckbox=document.getElementById('showClock');
const editModalEl=document.getElementById('editShortcutModal');
const editModal=new bootstrap.Modal(editModalEl);
const editName=document.getElementById('editShortcutName');
const editURL=document.getElementById('editShortcutURL');
const saveEditBtn=document.getElementById('saveEditShortcut');

const engines = {google:'https://www.google.com/search?q=',bing:'https://www.bing.com/search?q=',duckduckgo:'https://duckduckgo.com/?q=',yandex:'https://yandex.ru/search/?text=',brave:'https://search.brave.com/search?q='};

let selectedEngine=localStorage.getItem('searchEngine')||'google';
searchEngineSelect.value=selectedEngine;

let showClock=JSON.parse(localStorage.getItem('showClock')||'false');
showClockCheckbox.checked=showClock;

let history=JSON.parse(localStorage.getItem('history')||'[]');
let shortcuts=JSON.parse(localStorage.getItem('shortcuts')||'[{"name":"YouTube","url":"https://youtube.com"},{"name":"GitHub","url":"https://github.com"}]');
let currentEditIndex=null;

// ---------------------- Часы ----------------------
function updateClock(){
  if(!showClock){ clockEl.style.display='none'; return; }
  clockEl.style.display='block';
  const d=new Date();
  const h=d.getHours().toString().padStart(2,'0');
  const m=d.getMinutes().toString().padStart(2,'0');
  const s=d.getSeconds().toString().padStart(2,'0');
  clockEl.textContent=`${h}:${m}:${s}`;
}
setInterval(updateClock,1000);
updateClock();

// ---------------------- История с анимацией ----------------------
function updateDropdown(filter=''){
  historyDropdown.innerHTML='';
  const maxItems=5;
  const filtered=history.filter(h=>h.toLowerCase().includes(filter.toLowerCase())).slice(0,maxItems);
  filtered.forEach((item,index)=>{
    const div=document.createElement('div');
    div.className='history-item';
    div.style.animationDelay=`${index*0.05}s`;
    const text=document.createElement('span');
    text.className='history-text';
    text.textContent=item;
    div.appendChild(text);
    const clearBtn=document.createElement('button');
    clearBtn.className='clear-history-btn';
    clearBtn.innerHTML='<i class="bi bi-x"></i>';
    clearBtn.addEventListener('click',e=>{
      e.stopPropagation();
      history=history.filter(h=>h!==item);
      localStorage.setItem('history',JSON.stringify(history));
      updateDropdown(query.value);
    });
    div.appendChild(clearBtn);
    div.addEventListener('click',()=>{ query.value=item; doSearch(); });
    historyDropdown.appendChild(div);
  });
  historyDropdown.classList.toggle('show', filtered.length>0);
}

// ---------------------- Поиск ----------------------
function doSearch(){
  const text=query.value.trim();
  if(!text) return;
  history.unshift(text);
  history=[...new Set(history)].slice(0,50);
  localStorage.setItem('history',JSON.stringify(history));
  window.open(engines[selectedEngine]+encodeURIComponent(text),'_blank');
  updateDropdown();
}

// ---------------------- Карточки ----------------------
function renderShortcuts(){
  shortcutContainer.innerHTML='';
  shortcuts.forEach((sc,idx)=>{
    const card=document.createElement('div');
    card.className='shortcut-card';
    setTimeout(()=>card.classList.add('show'),10);
    const img=document.createElement('img');
    try{ img.src=`https://www.google.com/s2/favicons?domain=${new URL(sc.url).hostname}`; }
    catch{ img.src='https://via.placeholder.com/32'; }
    card.appendChild(img);
    const name=document.createElement('div');
    name.className='shortcut-name';
    name.textContent=sc.name;
    card.appendChild(name);

    const menuBtn=document.createElement('button');
    menuBtn.className='menu-btn';
    menuBtn.innerHTML='<i class="bi bi-three-dots-vertical"></i>';
    card.appendChild(menuBtn);

    const dropdown=document.createElement('div');
    dropdown.className='shortcut-dropdown';
    const editBtn=document.createElement('button');
    editBtn.textContent='Редактировать';
    editBtn.addEventListener('click',e=>{
      e.stopPropagation();
      currentEditIndex=idx;
      editName.value=sc.name;
      editURL.value=sc.url;
      editModal.show();
      dropdown.style.display='none';
    });
    const deleteBtn=document.createElement('button');
    deleteBtn.textContent='Удалить';
    deleteBtn.addEventListener('click',e=>{
      e.stopPropagation();
      shortcuts.splice(idx,1);
      localStorage.setItem('shortcuts',JSON.stringify(shortcuts));
      renderShortcuts();
    });
    dropdown.appendChild(editBtn);
    dropdown.appendChild(deleteBtn);
    card.appendChild(dropdown);

    menuBtn.addEventListener('click', e=>{
      e.stopPropagation();
      document.querySelectorAll('.shortcut-dropdown').forEach(d=>{if(d!==dropdown)d.style.display='none';});
      dropdown.style.display = dropdown.style.display==='flex'?'none':'flex';
    });

    card.addEventListener('click',()=>window.open(sc.url,'_blank'));
    shortcutContainer.appendChild(card);
  });

  if(shortcuts.length<10){
    const addCard=document.createElement('div');
    addCard.className='shortcut-card d-flex justify-content-center align-items-center';
    addCard.style.fontSize='2rem';
    addCard.textContent='+';
    addCard.style.color='var(--accent)';
    setTimeout(()=>addCard.classList.add('show'),10);
    addCard.addEventListener('click',()=>{
      currentEditIndex=null;
      editName.value='';
      editURL.value='';
      editModal.show();
    });
    shortcutContainer.appendChild(addCard);
  }

  Sortable.create(shortcutContainer,{
    animation:150,
    filter: '.shortcut-card:last-child',
    preventOnFilter:true,
    draggable:'.shortcut-card:not(:last-child)',
    onStart:e=>{ e.item.style.userSelect='none'; },
    onEnd:()=>{
      const newShortcuts=[];
      shortcutContainer.querySelectorAll('.shortcut-card:not(:last-child)').forEach(c=>{
        newShortcuts.push({name:c.querySelector('.shortcut-name').textContent,url:c.querySelector('img').src.replace('https://www.google.com/s2/favicons?domain=','https://')});
      });
      shortcuts=newShortcuts;
      localStorage.setItem('shortcuts',JSON.stringify(shortcuts));
    }
  });
}
renderShortcuts();

// ---------------------- События ----------------------
query.addEventListener('focus',()=>updateDropdown(query.value));
query.addEventListener('input',()=>updateDropdown(query.value));
searchBtn.addEventListener('click',doSearch);
query.addEventListener('keydown',e=>{if(e.key==='Enter') doSearch();});
youtubeBtn.addEventListener('click',()=>{
  const text=query.value.trim();
  if(!text) return;
  window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(text)}`,'_blank');
});

settingsBtn.addEventListener('click',()=>new bootstrap.Modal(document.getElementById('settingsModal')).show());
saveSettings.addEventListener('click',()=>{
  selectedEngine=searchEngineSelect.value;
  localStorage.setItem('searchEngine',selectedEngine);
  showClock=showClockCheckbox.checked;
  localStorage.setItem('showClock',JSON.stringify(showClock));
  bootstrap.Modal.getInstance(document.getElementById('settingsModal')).hide();
  updateClock();
});

saveEditBtn.addEventListener('click',()=>{
  const name=editName.value.trim();
  const url=editURL.value.trim();
  if(!name||!url) return;
  if(currentEditIndex===null){ shortcuts.push({name,url}); } 
  else { shortcuts[currentEditIndex]={name,url}; }
  localStorage.setItem('shortcuts',JSON.stringify(shortcuts));
  renderShortcuts();
  editModal.hide();
});

document.addEventListener('click', e=>{
  if(!document.querySelector('.search-box').contains(e.target)) historyDropdown.classList.remove('show');
  document.querySelectorAll('.shortcut-dropdown').forEach(d=>{ if(!d.parentElement.contains(e.target)) d.style.display='none'; });
});
</script>
</body>
</html>
