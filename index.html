<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shpekers</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(
                90deg,
                #f472b6 0%,
                #a78bfa 20%,
                #60a5fa 40%,
                #4ade80 60%,
                #facc15 80%,
                #f472b6 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .description {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 24px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #151515;
            border: 1px solid #252525;
            border-radius: 8px;
            text-decoration: none;
            color: #9ca3af;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .social-link:hover {
            background: #1a1a1a;
            border-color: #353535;
            transform: translateY(-2px);
        }

        .social-link i {
            font-size: 1.2rem;
        }

        .social-link.telegram i { color: #29b6f6; }
        .social-link.telegram:hover { border-color: #29b6f6; color: #29b6f6; }

        .social-link.github i { color: #e0e0e0; }
        .social-link.github:hover { border-color: #e0e0e0; color: #e0e0e0; }

        .social-link.discord i { color: #7289da; }
        .social-link.discord:hover { border-color: #7289da; color: #7289da; }

        .paradox-banner {
            background: linear-gradient(135deg, #1a1a2a 0%, #2a1a2a 100%);
            border: 1px solid #3a2a3a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .paradox-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(168, 85, 247, 0.1) 50%, transparent 70%);
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .paradox-banner-content {
            position: relative;
            z-index: 1;
        }

        .paradox-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #a855f7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .paradox-desc {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .paradox-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .paradox-btn:hover {
            background: linear-gradient(135deg, #8b5cf6 0%, #c084fc 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .section {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .section:hover {
            border-color: #252525;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .icon-download { color: #4ade80; }
        .section-title .icon-config { color: #60a5fa; }

        .section-desc {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #d1d5db;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .download-btn:hover {
            background: #252525;
            border-color: #3a3a3a;
            transform: translateY(-2px);
            color: #e5e7eb;
        }

        .download-btn i {
            font-size: 1.3rem;
            color: #60a5fa;
        }

        .download-info {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #4b5563;
            text-align: center;
        }

        .subscription-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 20px;
        }

        .subscription-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .subscription-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #d1d5db;
        }

        .subscription-status {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            background: #1a1a1a;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .subscription-status i {
            font-size: 0.5rem;
            color: #4ade80;
        }

        .subscription-url {
            background: #050505;
            border: 1px solid #151515;
            border-radius: 6px;
            padding: 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #6b7280;
            word-break: break-all;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .subscription-url:hover {
            background: #0a0a0a;
            border-color: #252525;
            color: #9ca3af;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #d1d5db;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #252525;
            border-color: #3a3a3a;
        }

        .btn i { color: #a78bfa; }

        .btn.copied {
            background: #1a2a1a;
            border-color: #2a3a2a;
            color: #4ade80;
        }

        .btn.copied i { color: #4ade80; }

        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
            font-size: 0.7rem;
            color: #374151;
            text-align: center;
        }

        @media (max-width: 600px) {
            .social-links {
                flex-direction: column;
                align-items: stretch;
            }
            
            .logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">SHPEKERS</h1>
            <p class="description">
                Тестируем...
            </p>
        </div>

        <div class="social-links">
            <a href="https://t.me/tgshpekers" class="social-link telegram" target="_blank">
                <i class="fab fa-telegram"></i>
                <span>Telegram</span>
            </a>
            <a href="https://github.com/shpekers" class="social-link github" target="_blank">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
            <a href="https://shpekers.ru/discord" class="social-link discord" target="_blank">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </a>
        </div>

        <div class="paradox-banner">
            <div class="paradox-banner-content">
                <div class="paradox-title">
                    <i class="fas fa-robot"></i>
                    Paradox VPN
                </div>
                <div class="paradox-desc">
                    У нас также есть бот в Telegram, где можно приобрести VPN.
                </div>
                <a href="https://t.me/Paradox_VPNbot" class="paradox-btn" target="_blank">
                    <i class="fab fa-telegram"></i>
                    Перейти в бота
                </a>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <i class="fas fa-download icon-download"></i>
                Скачать клиент
            </div>
            <div class="section-desc">
                Paradox Client
            </div>
            
            <a href="https://github.com/shpekers/paradox-client/raw/refs/heads/main/ParadoxSetup.exe" class="download-btn">
                <i class="fab fa-windows"></i>
                <span>Скачать Paradox Client</span>
            </a>
            
            <div class="download-info">
                Windows 10/11
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <i class="fas fa-link icon-config"></i>
                Конфигурация VLESS / GRPC
            </div>
            <div class="section-desc">
             
            </div>

            <div class="subscription-box">
                <div class="subscription-header">
                    <div class="subscription-name">Тестовая подписка</div>
                    <div class="subscription-status">
                        <i class="fas fa-circle"></i>
                        Активна
                    </div>
                </div>
                
                <div class="subscription-url" id="sub-url" onclick="copySubscription(event)">
                    https://shpekers.ru/n-sub-cfg.json
                </div>
                
                <button class="btn" onclick="copySubscription()">
                    <i class="far fa-copy"></i>
                    Копировать
                </button>
            </div>
        </div>

        <div class="footer">
            shpekers.ru
        </div>
    </div>

    <script>
        function copySubscription(event) {
            if (event) event.stopPropagation();
            
            const element = document.getElementById('sub-url');
            const text = element.textContent.trim();
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn');
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Скопировано';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
