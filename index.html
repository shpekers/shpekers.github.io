        <!-- Projects -->
        <div class="space-y-4">
            <!-- Project 1: Paradox App -->
            <div class="bg-[#222] border border-[#555] rounded-lg p-4 text-center">

                <div class="space-y-3">
                    <div class="flex gap-2 justify-center items-center">
                        <label for="vpnConfig" class="font-semibold text-[#aaa] text-sm w-20 text-right">Standart</label>

    </main>

    <script>
        function copyVPN(id) {
            const inputElement = document.getElementById(id);
            inputElement.select();
            inputElement.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(inputElement.value).then(() => {
                // Maybe show a more modern notification in the future
                alert("Ссылка скопирована!");
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Matrix Background Effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let drops = [];
        let columns = 0;
        const fontSize = 14;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789<>!@#$%^&*(){}[];:,.';

        function initializeMatrix() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            drops = Array(columns).fill(1).map(() => Math.floor(Math.random() * canvas.height));
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)'; // Fading effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(200, 200, 200, 0.6)'; // Character color
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Reset drop when it goes off-screen, with a random chance
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        let animationFrameId;
        function animate() {
            drawMatrix();
            animationFrameId = requestAnimationFrame(animate);
        }

        // Initialize and start
        initializeMatrix();
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationFrameId);
            initializeMatrix();
animate();
        });
    </script>

</body>
</html>
