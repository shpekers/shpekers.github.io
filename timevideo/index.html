<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретное видео из архива</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Roboto, Arial, sans-serif;
            cursor: default;
        }

        /* Контейнер плеера */
        .video-player {
            position: relative;
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            background: #000;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Превью (Обложка) */
        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        /* Оверлей при наведении */
        .video-player:hover .thumbnail {
            opacity: 0.8;
        }

        /* Большая кнопка Play */
        .big-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            background: rgba(255, 0, 0, 0.9);
            border-radius: 12%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .big-play-btn::after {
            content: '';
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent white;
        }

        .video-player:hover .big-play-btn {
            background: red;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Нижняя панель управления */
        .controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            display: flex;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 10px;
            right: 10px;
            height: 3px;
            background: rgba(255,255,255,0.3);
        }

        .progress-red {
            width: 0%;
            height: 100%;
            background: red;
        }

        .bottom-icons {
            display: flex;
            width: 100%;
            justify-content: space-between;
            color: white;
            font-size: 12px;
            margin-top: 5px;
        }

        /* Спиннер загрузки */
        #loader {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* СКРИМЕР */
        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10000;
        }

        #screamer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .shake {
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(10px, 10px); }
            50% { transform: translate(-10px, -10px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div class="video-player" id="player" onclick="launchScare()">
        <!-- Ссылка на красивое превью -->
        <img src="bg.png" class="thumbnail" id="thumb">
        
        <div class="big-play-btn" id="playBtn"></div>
        
        <div id="loader"></div>

        <div class="controls">
            <div class="progress-bar">
                <div class="progress-red"></div>
            </div>
            <div class="bottom-icons">
                <div>▶ 🔊 0:00 / 12:45</div>
                <div>HD ⚙️ ⛶</div>
            </div>
        </div>
    </div>

    <!-- Элементы испуга -->
    <div id="screamer">
        <img src="bg2.png" id="monsterImg">
    </div>

    <audio id="screamSound" src="https://www.myinstants.com/media/sounds/screamer.mp3"></audio>

    <script>
        function launchScare() {
            const player = document.getElementById('player');
            const playBtn = document.getElementById('playBtn');
            const thumb = document.getElementById('thumb');
            const loader = document.getElementById('loader');
            const screamer = document.getElementById('screamer');
            const sound = document.getElementById('screamSound');

            // Скрываем кнопку, показываем лоадер (эффект загрузки)
            playBtn.style.display = 'none';
            thumb.style.filter = 'brightness(0.5)';
            loader.style.display = 'block';

            // Жертва ждет 1.5 секунды, всматривается в "загрузку"
            setTimeout(() => {
                // Входим в полный экран для эффекта
                enterFullScreen();

                // Показываем монстра
                screamer.style.display = 'block';
                screamer.classList.add('shake');
                
                // Орем
                sound.play();

                // Через 4 секунды выключаем, чтобы не вызвать инфаркт
                setTimeout(() => {
                    location.reload(); 
                }, 4000);
            }, 1500);
        }

        function enterFullScreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        }
    </script>
</body>
</html>
